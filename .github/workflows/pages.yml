name: Publish game and Earth relay
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: |
            work/earth
            assets/story/earth
          key: earth-relay-${{ github.run_id }}
          restore-keys: earth-relay-
      - name: Refresh sourced headlines and English bulletin
        run: node scripts/refresh-earth.mjs
        env:
          MEROUTER_SERVICE_KEY: ${{ secrets.MEROUTER_SERVICE_KEY }}
      - run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
